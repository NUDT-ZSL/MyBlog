<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Agent 与静态分析网络封面">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb3c4" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1521"/><stop offset="1" stop-color="#080f16"/>
    </linearGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#61d7bd" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#61d7bd" stop-opacity="0.02"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <text x="40" y="52" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#b49bff" letter-spacing="3">AGENT + ANALYSIS / 04</text>
  <text x="40" y="82" font-family="Cascadia Code, Consolas, monospace" font-size="9" fill="#637586" letter-spacing="2">HYPOTHESIS → CHECK → PROOF</text>
  <text x="760" y="418" text-anchor="end" font-family="Cascadia Code, Consolas, monospace" font-size="86" fill="#9bb3c4" fill-opacity="0.05">LOOP</text>
  <g stroke="#9bb3c4" stroke-opacity="0.28" stroke-width="1" fill="none" stroke-dasharray="4 5">
    <path d="M400 238 265 154M400 238l142-91M400 238 224 316M400 238l154 75M265 154 224 316M542 147l-3 169"/>
  </g>
  <g stroke="#b49bff" stroke-opacity="0.45" stroke-width="1.1" fill="none">
    <path d="M400 238 265 154M400 238l142-91M400 238 224 316M400 238l154 75" stroke-dasharray="4 6"/>
  </g>
  <circle cx="400" cy="238" r="83" fill="url(#center)" stroke="#61d7bd" stroke-opacity="0.55"/>
  <circle cx="400" cy="238" r="63" fill="none" stroke="#61d7bd" stroke-opacity="0.2" stroke-dasharray="2 6"/>
  <g font-family="Cascadia Code, Consolas, monospace" text-anchor="middle">
    <text x="400" y="232" font-size="11" fill="#dce6ef">LLVM IR</text>
    <text x="400" y="250" font-size="8" fill="#61d7bd">STATE</text>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" text-anchor="middle">
    <g>
      <rect x="211" y="122" width="108" height="62" rx="8" fill="#101a26" stroke="#b49bff" stroke-opacity="0.45"/>
      <text x="265" y="145" font-size="8" fill="#b49bff">AGENT</text>
      <text x="265" y="162" font-size="10" fill="#dce6ef">hypothesize</text>
      <text x="265" y="175" font-size="7" fill="#637586">invariant</text>
    </g>
    <g>
      <rect x="490" y="104" width="108" height="62" rx="8" fill="#101a26" stroke="#7fa9ff" stroke-opacity="0.45"/>
      <text x="544" y="127" font-size="8" fill="#7fa9ff">TOOL</text>
      <text x="544" y="144" font-size="10" fill="#dce6ef">alive2 / z3</text>
      <text x="544" y="157" font-size="7" fill="#637586">counterexample</text>
    </g>
    <g>
      <rect x="168" y="288" width="112" height="62" rx="8" fill="#101a26" stroke="#61d7bd" stroke-opacity="0.4"/>
      <text x="224" y="311" font-size="8" fill="#61d7bd">ANALYSIS</text>
      <text x="224" y="328" font-size="10" fill="#dce6ef">data-flow</text>
      <text x="224" y="341" font-size="7" fill="#637586">fixpoint</text>
    </g>
    <g>
      <rect x="494" y="274" width="118" height="62" rx="8" fill="#101a26" stroke="#e7b76b" stroke-opacity="0.4"/>
      <text x="553" y="297" font-size="8" fill="#e7b76b">OUTPUT</text>
      <text x="553" y="314" font-size="10" fill="#dce6ef">patch / report</text>
      <text x="553" y="327" font-size="7" fill="#637586">human review</text>
    </g>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="8" fill="#637586">
    <text x="40" y="410">loop until</text>
    <text x="116" y="410" fill="#b49bff" fill-opacity="0.8">evidence ≥ threshold</text>
    <text x="40" y="427">never trust a confident model</text>
  </g>
  <g fill="#61d7bd">
    <circle cx="265" cy="154" r="2.5"/><circle cx="542" cy="147" r="2.5"/>
    <circle cx="224" cy="316" r="2.5"/><circle cx="554" cy="313" r="2.5"/>
  </g>
</svg>
