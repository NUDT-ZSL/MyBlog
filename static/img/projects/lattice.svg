<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="静态分析抽象格封面">
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb3c4" stroke-opacity="0.07"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a151e"/><stop offset="1" stop-color="#070f16"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#7fa9ff" fill-opacity="0.7"/>
    </marker>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <text x="40" y="52" font-family="Cascadia Code, Consolas, monospace" font-size="11" fill="#7fa9ff" letter-spacing="3">ABSTRACT DOMAIN / 02</text>
  <text x="40" y="82" font-family="Cascadia Code, Consolas, monospace" font-size="9" fill="#637586" letter-spacing="2">FIXPOINT ITERATION</text>
  <text x="760" y="418" text-anchor="end" font-family="Cascadia Code, Consolas, monospace" font-size="86" fill="#9bb3c4" fill-opacity="0.05">LATTICE</text>
  <g stroke="#7fa9ff" stroke-opacity="0.45" stroke-width="1.2" fill="none" marker-end="url(#arrow)">
    <path d="M400 140v38M400 228v38M300 205h-58v38M500 205h58v38M242 302v38M558 302v38"/>
    <path d="M400 142l-80 53M400 142l80 53"/>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" text-anchor="middle">
    <g>
      <rect x="345" y="93" width="110" height="46" rx="23" fill="#101d2d" stroke="#7fa9ff" stroke-opacity="0.7"/>
      <text x="400" y="113" font-size="8" fill="#7fa9ff">TOP</text>
      <text x="400" y="128" font-size="12" fill="#dce6ef">[−∞, +∞]</text>
    </g>
    <g>
      <rect x="328" y="180" width="144" height="46" rx="8" fill="#0f1b27" stroke="#9bb3c4" stroke-opacity="0.35"/>
      <text x="400" y="199" font-size="8" fill="#8fa3b4">INTERVAL</text>
      <text x="400" y="214" font-size="11" fill="#dce6ef">x ∈ [0, 15]</text>
    </g>
    <g>
      <rect x="224" y="244" width="116" height="46" rx="8" fill="#0f1b27" stroke="#9bb3c4" stroke-opacity="0.3"/>
      <text x="282" y="263" font-size="8" fill="#8fa3b4">CONST</text>
      <text x="282" y="278" font-size="11" fill="#dce6ef">x = 4</text>
    </g>
    <g>
      <rect x="460" y="244" width="116" height="46" rx="8" fill="#0f1b27" stroke="#9bb3c4" stroke-opacity="0.3"/>
      <text x="518" y="263" font-size="8" fill="#8fa3b4">SIGN</text>
      <text x="518" y="278" font-size="11" fill="#dce6ef">x &gt; 0</text>
    </g>
    <g>
      <rect x="166" y="342" width="152" height="40" rx="20" fill="#0b1820" stroke="#61d7bd" stroke-opacity="0.55"/>
      <text x="242" y="366" font-size="10" fill="#61d7bd">BOTTOM / ⊥</text>
    </g>
    <g>
      <rect x="482" y="342" width="152" height="40" rx="20" fill="#0b1820" stroke="#61d7bd" stroke-opacity="0.55"/>
      <text x="558" y="366" font-size="10" fill="#61d7bd">UNREACHABLE</text>
    </g>
  </g>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="8" fill="#637586">
    <text x="40" y="412">lfp(F) = ⋃ᵢ Fⁱ(⊥)</text>
    <text x="40" y="428" fill="#7fa9ff" fill-opacity="0.8">widen → narrow → prove</text>
  </g>
  <circle cx="710" cy="88" r="3" fill="#7fa9ff"/>
</svg>
